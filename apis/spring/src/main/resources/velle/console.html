<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velle console</title>
<style>
  :root {
    --bg: #fafaf7; --fg: #1c1c1a; --muted: #6b6b66; --line: #dddcd6; --panel: #ffffff;
    --accent: #2b5fb3; --ok: #2d7a3a; --bad: #b3362b; --chip: #eeede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e7e2; --muted: #9a9a94; --line: #33343a; --panel: #1e1f24;
      --accent: #7fa7e8; --ok: #6fc07c; --bad: #e07a70; --chip: #2a2b31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
    /* the sidebar and the main pane each scroll on their own, so the shape list keeps its place while a long table scrolls */
    display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden;
  }

  /* the sidebar: the model's shapes, refinements, acts, and schedules, and the request header */
  nav { border-right: 1px solid var(--line); padding: 16px; overflow: auto; min-height: 0; }
  nav h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .02em; }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
  nav a { display: block; padding: 3px 6px; border-radius: 4px; color: var(--fg); text-decoration: none; }
  nav a:hover, nav a.active { background: var(--chip); }
  nav a .tag { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .request-header { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; }
  .request-header input { width: 100%; margin-bottom: 6px; font-size: 12px; }
  .request-header .note { color: var(--muted); font-size: 12px; margin: 0; }

  /* the main pane */
  main { padding: 20px 28px; overflow: auto; min-height: 0; }
  h2.title { margin: 0 0 4px; font-size: 20px; }
  .subtitle { color: var(--muted); margin: 0 0 16px; }
  .muted { color: var(--muted); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input, select, textarea, button {
    font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px;
  }
  input.where { flex: 1; min-width: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  input.order-by { width: 160px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }

  /* a shape's table */
  table {
    border-collapse: collapse; width: 100%; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.numeric { font-variant-numeric: tabular-nums; }
  a.ref { color: var(--accent); text-decoration: none; }
  a.ref:hover { text-decoration: underline; }
  .chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 0 8px; font-size: 12px; margin: 0 4px 4px 0; }
  .chip.on { background: var(--ok); color: #fff; }

  /* one record */
  dl {
    display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
  }
  dt { color: var(--muted); }
  dt .member-type { font-size: 11px; }
  dd { margin: 0; }

  /* an act's form */
  form.act-form {
    display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: center; max-width: 720px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px;
  }
  form.act-form label { color: var(--muted); }
  form.act-form textarea { font-family: ui-monospace, Menlo, monospace; min-height: 70px; }
  form.act-form .hint { grid-column: 2; color: var(--muted); font-size: 12px; margin-top: -6px; }

  /* the answer to a commit or a tick */
  pre.outcome {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px;
    white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, Menlo, monospace;
  }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }

  @media (max-width: 760px) {
    /* stacked: the sidebar takes the top of the screen and still scrolls on its own */
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  }
</style>
</head>
<body>
<nav>
  <h1>Velle</h1>
  <div id="navigation"></div>
  <div class="request-header">
    <h2>Request header</h2>
    <input id="header-name" placeholder="Header name, e.g. X-Velle-Actor">
    <input id="header-value" placeholder="Value, e.g. Staff:1">
    <p class="note">Sent with every request, for the application's actor resolver.</p>
  </div>
</nav>
<main id="main"><div class="empty">Loading the model…</div></main>
<script>
// The console is a client of the REST API and nothing else: it reads the model's description from
// GET <api> once, and renders every view from that description and the records the API answers.
// The starter substitutes the API path and the ticks flag into the two placeholders (VelleConsole.kt).
const API = "__API__";
const TICKS_EXPOSED = __TICKS__ === true;

// The description GET <api> answers, kept once loaded, and its shapes and refinements by name.
let model = null;
const shapesByName = {};

// ── talking to the API ──

// The one header the developer typed in the sidebar, kept in the browser between visits.
const STORED_HEADER_NAME = 'velle.hname';
const STORED_HEADER_VALUE = 'velle.hvalue';

function requestHeaders(extraHeaders) {
  const headers = Object.assign({}, extraHeaders || {});
  const headerName = localStorage.getItem(STORED_HEADER_NAME);
  const headerValue = localStorage.getItem(STORED_HEADER_VALUE);
  if (headerName && headerValue) headers[headerName] = headerValue;
  return headers;
}

// One call to the API: the answer's status and its body, parsed as JSON when it is JSON.
async function callApi(path, options) {
  options = options || {};
  const headers = requestHeaders(options.body ? { 'Content-Type': 'application/json' } : {});
  const response = await fetch(API + path, Object.assign({ headers }, options));
  const text = await response.text();
  let body;
  try { body = text ? JSON.parse(text) : null; } catch (notJson) { body = text; }
  return { ok: response.ok, status: response.status, body };
}

// What to show for a failed answer: the API's message and its details when it gave them, else the status.
function errorText(answer) {
  const body = answer.body;
  if (body && body.error) {
    const details = body.details && body.details.length ? '\n' + body.details.join('\n') : '';
    return body.error + details;
  }
  const bodyText = body ? '\n' + (typeof body === 'string' ? body : JSON.stringify(body)) : '';
  return 'The API answered ' + answer.status + bodyText;
}

// ── rendering values ──

function escapeHtml(value) {
  const replacements = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
  return String(value).replace(/[&<>"]/g, character => replacements[character]);
}

// A reference on the wire is the pair {shape, key}, wherever it appears.
function isReference(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value) && 'shape' in value && 'key' in value;
}

function recordHash(shapeName, key) {
  return `#record/${encodeURIComponent(shapeName)}/${encodeURIComponent(key)}`;
}

function referenceLink(reference) {
  return `<a class="ref" href="${recordHash(reference.shape, reference.key)}">${escapeHtml(reference.shape)}#${escapeHtml(reference.key)}</a>`;
}

// One value of a record: a reference as a link, a list joined, a boolean as yes or no, nothing as a dash.
function renderValue(value) {
  if (value === null || value === undefined) return '<span class="muted">—</span>';
  if (isReference(value)) return referenceLink(value);
  if (Array.isArray(value)) {
    if (value.length === 0) return '<span class="muted">none</span>';
    return isReference(value[0]) ? value.map(referenceLink).join(', ') : escapeHtml(value.join(', '));
  }
  if (typeof value === 'boolean') return value ? 'yes' : 'no';
  return escapeHtml(value);
}

// A record's flags are named is<Refinement>; a chip shows the refinement's name.
function flagChips(flagNames) {
  return flagNames.map(flagName => `<span class="chip on">${escapeHtml(flagName.slice(2))}</span>`).join('');
}

// A refinement over more than one base: a reference to it names the shape as well as the key.
function isUnionType(typeName) {
  const shape = shapesByName[typeName];
  return Boolean(shape && shape.kind === 'refinement' && shape.bases && shape.bases.length > 1);
}

// The member a shape's table is ordered by until the developer picks one: the first member that is
// neither an inverse collection nor the actor, and whose type sorts (a scalar or an extension type;
// not another shape, not a boolean, bytes, or a uuid).
const ORDERABLE_TYPES = new Set(['text', 'integer', 'long', 'decimal', 'double', 'Date', 'DateTime', 'time', 'duration']);
const UNORDERABLE_SCALARS = ['boolean', 'bytes', 'uuid'];

function defaultOrderBy(shape) {
  const member = shape.members.find(candidate => {
    if (candidate.kind === 'inverse' || candidate.kind === 'actor') return false;
    if (ORDERABLE_TYPES.has(candidate.type)) return true;
    const isShapeType = Boolean(shapesByName[candidate.type]);
    return !isShapeType && !UNORDERABLE_SCALARS.includes(candidate.type);
  });
  return member ? member.name : '';
}

// ── the sidebar and the routes ──

function navigationLink(target, label, tags) {
  const tagMarkup = (tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
  return `<a href="#${target}" data-nav="${target}">${escapeHtml(label)}${tagMarkup}</a>`;
}

function renderNavigation() {
  const shapes = model.shapes.filter(shape => shape.kind === 'shape');
  const refinements = model.shapes.filter(shape => shape.kind === 'refinement');
  let html = '<h2>Shapes</h2>' + shapes.map(shape => navigationLink('shape/' + shape.name, shape.name, shape.act ? ['act'] : [])).join('');
  if (refinements.length) {
    html += '<h2>Refinements</h2>' + refinements.map(refinement => navigationLink('shape/' + refinement.name, refinement.name)).join('');
  }
  html += '<h2>Acts</h2>' + model.acts.map(act => {
    const tags = [];
    if (act.transient) tags.push('transient');
    if (act.actor) tags.push('by ' + act.actor.shape);
    return navigationLink('act/' + act.name, act.name, tags);
  }).join('');
  if (TICKS_EXPOSED && model.schedules.length) {
    html += '<h2>Schedules</h2>' + model.schedules.map(schedule => navigationLink('tick/' + schedule, schedule)).join('');
  }
  document.getElementById('navigation').innerHTML = html;
}

// The view is in the URL's hash: shape/<Shape>, record/<Shape>/<key>, act/<Act>, or tick/<Schedule>.
function currentHash() {
  if (location.hash.length > 1) return location.hash.slice(1);
  return model.shapes[0] ? 'shape/' + model.shapes[0].name : '';
}

function route() {
  const hash = currentHash();
  const [view, first, second] = hash.split('/').map(decodeURIComponent);
  // a record lights up its shape in the sidebar; every other view lights up its own link
  const activeTarget = view === 'record' ? 'shape/' + first : hash;
  document.querySelectorAll('nav a').forEach(link => link.classList.toggle('active', link.dataset.nav === activeTarget));
  if (view === 'shape') showShape(first);
  else if (view === 'record') showRecord(first, second);
  else if (view === 'act') showAct(first);
  else if (view === 'tick') showTick(first);
}

// ── a shape: its records as a table ──

// What the developer last asked of each shape's table: the predicate, the order, and the pages read so far.
const tableStates = {};

function tableStateFor(shape) {
  if (!tableStates[shape.name]) {
    tableStates[shape.name] = { where: '', orderBy: defaultOrderBy(shape), pageSize: 25, nextCursor: null, items: [] };
  }
  return tableStates[shape.name];
}

function shapeSubtitle(shape) {
  const what = shape.kind === 'refinement' ? 'Refinement of ' + escapeHtml(shape.bases.join(' or ')) : 'Shape';
  return what + (shape.act ? ', committed as an act' : '') + '.';
}

function renderShapeHeader(shape, state) {
  return `<h2 class="title">${escapeHtml(shape.name)}</h2>
    <p class="subtitle">${shapeSubtitle(shape)}</p>
    <form class="toolbar" id="query-form">
      <input class="where" id="where" placeholder="where, in the spec's language: balance > 0 and due < today" value="${escapeHtml(state.where)}">
      <label>order by <input class="order-by" id="order-by" value="${escapeHtml(state.orderBy)}"></label>
      <button class="primary">Query</button>
      <span id="count" class="muted"></span>
    </form>
    <div id="table"></div>
    <div class="toolbar" id="pager"></div>`;
}

// The table: the key, every member but the inverse collections, those collections as counts, then the flags set.
function renderTable(shape, records) {
  if (records.length === 0) return '<div class="empty">No records.</div>';
  const columns = shape.members.filter(member => member.kind !== 'inverse');
  const inverseColumns = shape.members.filter(member => member.kind === 'inverse');
  const flags = shape.flags || [];

  const headerCells = ['<th>key</th>']
    .concat(columns.map(column => `<th>${escapeHtml(column.name)}</th>`))
    .concat(inverseColumns.map(column => `<th>${escapeHtml(column.name)}</th>`))
    .concat(flags.length ? ['<th>is</th>'] : []);

  const rows = records.map(record => {
    const cells = [`<td>${referenceLink(record)}</td>`]
      .concat(columns.map(column => {
        const value = record[column.name];
        return `<td class="${typeof value === 'number' ? 'numeric' : ''}">${renderValue(value)}</td>`;
      }))
      .concat(inverseColumns.map(column => {
        const collection = record[column.name];
        return `<td class="numeric">${Array.isArray(collection) ? collection.length : '—'}</td>`;
      }))
      .concat(flags.length ? [`<td>${flagChips(flags.filter(flagName => record[flagName]))}</td>`] : []);
    return `<tr>${cells.join('')}</tr>`;
  });

  return `<table><thead><tr>${headerCells.join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
}

// Shows a shape's table. Called again with loadNextPage when the developer queries or asks for more:
// the header stays and the next page is read after the cursor the last answer gave.
async function showShape(shapeName, loadNextPage) {
  const shape = shapesByName[shapeName];
  if (!shape) return;
  const state = tableStateFor(shape);

  if (!loadNextPage) {
    document.getElementById('main').innerHTML = renderShapeHeader(shape, state);
    document.getElementById('query-form').onsubmit = event => {
      event.preventDefault();
      state.where = document.getElementById('where').value;
      state.orderBy = document.getElementById('order-by').value;
      state.nextCursor = null;
      state.items = [];
      showShape(shapeName, true);
    };
    state.nextCursor = null;
    state.items = [];
  }

  const query = new URLSearchParams();
  if (state.where) query.set('where', state.where);
  if (state.orderBy) query.set('orderBy', state.orderBy);
  query.set('size', state.pageSize);
  if (state.nextCursor) query.set('after', state.nextCursor);

  const page = await callApi(`/shapes/${encodeURIComponent(shapeName)}?${query}`);
  const tableElement = document.getElementById('table');
  const pagerElement = document.getElementById('pager');
  if (!page.ok) {
    tableElement.innerHTML = `<pre class="outcome bad">${escapeHtml(errorText(page))}</pre>`;
    pagerElement.innerHTML = '';
    return;
  }

  state.items = state.items.concat(page.body.items);
  state.nextCursor = page.body.next;
  tableElement.innerHTML = renderTable(shape, state.items);
  pagerElement.innerHTML = `<span class="muted">${state.items.length} shown</span>` + (state.nextCursor ? ' <button id="more">More</button>' : '');
  if (state.nextCursor) document.getElementById('more').onclick = () => showShape(shapeName, true);

  const whereQuery = state.where ? '?where=' + encodeURIComponent(state.where) : '';
  const counted = await callApi(`/shapes/${encodeURIComponent(shapeName)}/count${whereQuery}`);
  if (counted.ok) document.getElementById('count').textContent = counted.body.count + ' in all';
}

// ── one record: its members ──

function memberLabel(member) {
  const typeNote = escapeHtml(member.type) + (member.kind !== 'stored' ? ' · ' + escapeHtml(member.kind) : '');
  return `${escapeHtml(member.name)} <span class="muted member-type">${typeNote}</span>`;
}

// The refinements of this one shape that the record belongs to, each readable as a record of its own.
function refinementsHolding(shapeName, record) {
  return model.shapes.filter(candidate =>
    candidate.kind === 'refinement'
      && candidate.bases && candidate.bases.length === 1 && candidate.bases[0] === shapeName
      && record['is' + candidate.name]);
}

async function showRecord(shapeName, key) {
  const mainElement = document.getElementById('main');
  const title = `<h2 class="title">${escapeHtml(shapeName)} #${escapeHtml(key)}</h2>`;
  const answer = await callApi(`/shapes/${encodeURIComponent(shapeName)}/${encodeURIComponent(key)}`);
  if (!answer.ok) {
    mainElement.innerHTML = title + `<pre class="outcome bad">${escapeHtml(errorText(answer))}</pre>`;
    return;
  }
  const record = answer.body;
  const shape = shapesByName[shapeName] || { members: [], flags: [] };
  const flagsSet = (shape.flags || []).filter(flagName => record[flagName]);
  const memberRows = shape.members.map(member => `<dt>${memberLabel(member)}</dt><dd>${renderValue(record[member.name])}</dd>`).join('');
  const refinements = refinementsHolding(shapeName, record);
  const readableAs = refinements.length
    ? '<p class="muted">Read as a member of: ' + refinements.map(refinement =>
        `<a class="ref" href="${recordHash(refinement.name, key)}">${escapeHtml(refinement.name)}</a>`).join(', ') + '</p>'
    : '';
  mainElement.innerHTML = `${title}<p class="subtitle">${flagChips(flagsSet) || 'A record.'}</p><dl>${memberRows}</dl>${readableAs}`;
}

// ── an act: a form that commits it ──

const NUMERIC_TYPES = ['integer', 'long', 'decimal', 'double'];

// The input for one field of the act, from the field's kind and type.
function inputFor(field, inputId) {
  if (field.kind === 'reference') {
    const placeholder = isUnionType(field.type)
      ? 'Shape#key, one of ' + shapesByName[field.type].bases.join(', ')
      : 'key of a ' + field.type;
    return `<input id="${inputId}" placeholder="${escapeHtml(placeholder)}">`;
  }
  if (field.kind === 'references') return `<input id="${inputId}" placeholder="keys, comma-separated">`;
  if (field.kind === 'values') return `<input id="${inputId}" placeholder="${escapeHtml(field.type)} values, comma-separated">`;
  switch (field.type) {
    case 'boolean': return `<select id="${inputId}"><option value="">—</option><option value="true">true</option><option value="false">false</option></select>`;
    case 'integer': case 'long': return `<input id="${inputId}" type="number" step="1">`;
    case 'decimal': case 'double': return `<input id="${inputId}" type="number" step="any">`;
    case 'Date': return `<input id="${inputId}" type="date">`;
    case 'DateTime': return `<input id="${inputId}" type="datetime-local" step="1">`;
    case 'time': return `<input id="${inputId}" type="time" step="1">`;
    default: return `<input id="${inputId}" placeholder="${escapeHtml(field.type)}">`;
  }
}

// What the developer typed, as the JSON value the field's type takes.
function parseScalar(typeName, text) {
  if (NUMERIC_TYPES.includes(typeName)) return Number(text);
  if (typeName === 'boolean') return text === 'true';
  // a datetime-local input gives the browser's local time; the API takes an instant
  if (typeName === 'DateTime' && !text.endsWith('Z')) return new Date(text).toISOString();
  return text;
}

// A reference typed as Shape#key becomes the {shape, key} pair; a bare key stays a key, numeric when it looks like one.
function parseReference(text) {
  const shapeAndKey = text.match(/^(\w+)#(.+)$/);
  if (shapeAndKey) return { shape: shapeAndKey[1], key: shapeAndKey[2] };
  return /^\d+$/.test(text) ? Number(text) : text;
}

function fieldValue(field, inputElement) {
  const text = inputElement.value.trim();
  if (text === '') return undefined;
  if (field.kind === 'reference') return parseReference(text);
  if (field.kind === 'references') return text.split(',').map(part => parseReference(part.trim()));
  if (field.kind === 'values') return text.split(',').map(part => parseScalar(field.type, part.trim()));
  return parseScalar(field.type, text);
}

// A field that may carry a new nested record takes a key, or the record itself as JSON.
function parseKeyOrNewRecord(text) {
  if (text.startsWith('{')) return JSON.parse(text);
  return /^\d+$/.test(text) ? Number(text) : text;
}

function renderField(field, index) {
  const inputId = 'field-' + index;
  const requiredMark = field.optional ? '' : ' *';
  const control = field.newValue
    ? `<textarea id="${inputId}" placeholder='a key, or a new ${escapeHtml(field.type)} as JSON: {"@shape": "${escapeHtml(field.newValue[0].shape)}", ...}'></textarea>`
    : inputFor(field, inputId);
  const hint = escapeHtml(field.type)
    + (field.kind !== 'value' ? ' · ' + escapeHtml(field.kind) : '')
    + (field.mayBeNew ? ' · may be {"new": n}' : '');
  return `<label for="${inputId}">${escapeHtml(field.name)}${requiredMark}</label>${control}<div class="hint">${hint}</div>`;
}

// A part is a collection of new records committed with the act, typed as a JSON list.
function renderPart(part, index) {
  const inputId = 'part-' + index;
  const fieldNames = part.fields.map(partField => partField.name);
  const placeholder = `new ${escapeHtml(part.shape)} values as JSON: [{${fieldNames.map(name => '"' + name + '": …').join(', ')}}]`;
  return `<label for="${inputId}">${escapeHtml(part.field)}</label>`
    + `<textarea id="${inputId}" placeholder='${placeholder}'></textarea>`
    + `<div class="hint">parts: ${escapeHtml(part.shape)} · ${fieldNames.map(escapeHtml).join(', ')}</div>`;
}

function actSubtitle(act) {
  const effect = act.transient
    ? 'A transient act: it leaves no record of its own.'
    : 'A durable act: the commit becomes a ' + escapeHtml(act.name) + ' record.';
  const actor = act.actor ? ' Committed by a ' + escapeHtml(act.actor.shape) + ', resolved from the request.' : '';
  return effect + actor;
}

// The request body from the form's inputs; throws when a JSON field does not parse.
function readActForm(act) {
  const body = {};
  act.fields.forEach((field, index) => {
    const inputElement = document.getElementById('field-' + index);
    if (field.newValue) {
      const text = inputElement.value.trim();
      if (text) body[field.name] = parseKeyOrNewRecord(text);
    } else {
      const value = fieldValue(field, inputElement);
      if (value !== undefined) body[field.name] = value;
    }
  });
  (act.parts || []).forEach((part, index) => {
    const text = document.getElementById('part-' + index).value.trim();
    if (text) body[part.field] = JSON.parse(text);
  });
  return body;
}

function showOutcome(accepted, text, reference) {
  const outcomeElement = document.getElementById('outcome');
  outcomeElement.hidden = false;
  outcomeElement.className = 'outcome ' + (accepted ? 'ok' : 'bad');
  outcomeElement.innerHTML = escapeHtml(text) + (reference ? ' · ' + referenceLink(reference) : '');
}

function showAct(actName) {
  const act = model.acts.find(candidate => candidate.name === actName);
  if (!act) return;
  const parts = act.parts || [];
  document.getElementById('main').innerHTML = `<h2 class="title">${escapeHtml(actName)}</h2>
    <p class="subtitle">${actSubtitle(act)}</p>
    <form class="act-form" id="act-form">
      ${act.fields.map(renderField).join('')}
      ${parts.map(renderPart).join('')}
      <span></span><div><button class="primary">Commit</button></div>
    </form>
    <pre class="outcome" id="outcome" hidden></pre>`;

  document.getElementById('act-form').onsubmit = async event => {
    event.preventDefault();
    let body;
    try {
      body = readActForm(act);
    } catch (parseError) {
      showOutcome(false, 'The JSON in a field does not parse: ' + parseError.message);
      return;
    }
    const answer = await callApi(`/acts/${encodeURIComponent(actName)}`, { method: 'POST', body: JSON.stringify(body) });
    const outcome = answer.body || {};
    if (answer.ok) {
      const what = outcome.ref ? ': ' + outcome.ref.shape + '#' + outcome.ref.key : ' (no record: a transient act)';
      showOutcome(true, 'Accepted' + what, outcome.ref);
    } else if (answer.status === 422) {
      // a refusal is data: the rule that refused, or the reason
      showOutcome(false, 'Refused: ' + (outcome.rejection ? outcome.rejection.message : outcome.reason));
    } else {
      showOutcome(false, errorText(answer));
    }
  };
}

// ── a schedule: a button that ticks it ──

function showTick(schedule) {
  document.getElementById('main').innerHTML = `<h2 class="title">${escapeHtml(schedule)}</h2>
    <p class="subtitle">Run every rule on this schedule now.</p>
    <button class="primary" id="tick">Tick ${escapeHtml(schedule)}</button>
    <pre class="outcome" id="outcome" hidden></pre>`;

  document.getElementById('tick').onclick = async () => {
    const answer = await callApi(`/ticks/${encodeURIComponent(schedule)}`, { method: 'POST' });
    const outcomeElement = document.getElementById('outcome');
    outcomeElement.hidden = false;
    if (!answer.ok) {
      outcomeElement.className = 'outcome bad';
      outcomeElement.textContent = errorText(answer);
      return;
    }
    const rejections = answer.body.rejections || [];
    outcomeElement.className = 'outcome ' + (rejections.length ? 'bad' : 'ok');
    outcomeElement.textContent = `Ran at ${answer.body.at}` + (rejections.length
      ? `\n${rejections.length} firing(s) rejected:\n\n` + rejections.map(rejection => rejection.message).join('\n\n')
      : ', nothing rejected.');
  };
}

// ── start ──

function bindStoredInput(inputElement, storageKey) {
  inputElement.value = localStorage.getItem(storageKey) || '';
  inputElement.oninput = () => localStorage.setItem(storageKey, inputElement.value.trim());
}

async function start() {
  bindStoredInput(document.getElementById('header-name'), STORED_HEADER_NAME);
  bindStoredInput(document.getElementById('header-value'), STORED_HEADER_VALUE);
  const described = await callApi('');
  if (!described.ok) {
    document.getElementById('main').innerHTML = `<pre class="outcome bad">The API at ${escapeHtml(API)} answered ${described.status}.</pre>`;
    return;
  }
  model = described.body;
  model.shapes.forEach(shape => { shapesByName[shape.name] = shape; });
  renderNavigation();
  route();
  window.onhashchange = route;
}

start();
</script>
