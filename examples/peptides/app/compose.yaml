# The database `gradle :examples:/Users/daveclay/code/velle/peptidespp:bootRun` starts for the peptides application.
name: velle-peptides   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peptides
      POSTGRES_USER: peptides
      POSTGRES_PASSWORD: peptides
    ports:
      - "5432"
