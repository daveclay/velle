# The database `gradle :examples:/Users/daveclay/code/velle/pharmacypp:bootRun` starts for the pharmacy application.
name: velle-pharmacy   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    ports:
      - "5432"
