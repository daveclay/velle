# The pharmacy demo at the identity provider. compose.yaml mounts this folder into
# Authentik, which reads the file at startup and creates or updates what it lists.
# Demo values throughout, checked in on purpose: the eleven members of staff, the
# OpenID Connect client the pharmacy application signs in through, and an app
# password each for getting a token without a browser.
#
# Each person's `pk` is fixed, and the client's `sub_mode: user_id` sends it as
# the token's `sub`. The pharmacy roster (Roster.kt) gives the same value as each
# Staff record's identityId, and the seed hires them with it. The two files must
# agree.
version: 1
metadata:
  name: Velle pharmacy demo
entries:
  - model: authentik_core.user
    identifiers:
      pk: 1001
    attrs:
      username: margaret
      name: Margaret Hale
      email: margaret@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1002
    attrs:
      username: devon
      name: Devon Okoro
      email: devon@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1003
    attrs:
      username: priya
      name: Priya Raman
      email: priya@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1004
    attrs:
      username: luis
      name: Luis Ortega
      email: luis@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1005
    attrs:
      username: hannah
      name: Hannah Weiss
      email: hannah@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1006
    attrs:
      username: samuel
      name: Samuel Adeyemi
      email: samuel@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1007
    attrs:
      username: tom
      name: Tom Brandt
      email: tom@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1008
    attrs:
      username: aisha
      name: Aisha Khan
      email: aisha@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1009
    attrs:
      username: marco
      name: Marco Russo
      email: marco@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1010
    attrs:
      username: jade
      name: Jade Nguyen
      email: jade@pharmacy.example
      password: pharmacy-demo
      type: internal
  - model: authentik_core.user
    identifiers:
      pk: 1011
    attrs:
      username: chen
      name: Chen Wei
      email: chen@pharmacy.example
      password: pharmacy-demo
      type: internal

  # An app password lets a script or a test ask for a token as the person with no
  # browser (the client_credentials grant with username and password).
  - model: authentik_core.token
    identifiers:
      identifier: margaret-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, margaret]]
      intent: app_password
      key: margaret-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: devon-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, devon]]
      intent: app_password
      key: devon-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: priya-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, priya]]
      intent: app_password
      key: priya-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: luis-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, luis]]
      intent: app_password
      key: luis-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: hannah-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, hannah]]
      intent: app_password
      key: hannah-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: samuel-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, samuel]]
      intent: app_password
      key: samuel-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: tom-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, tom]]
      intent: app_password
      key: tom-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: aisha-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, aisha]]
      intent: app_password
      key: aisha-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
      identifier: marco-pharmacy-app-password
    attrs:
      user: !Find [authentik_core.user, [username, marco]]
      intent: app_password
      key: marco-app-password
      expiring: false
  - model: authentik_core.token
    identifiers:
