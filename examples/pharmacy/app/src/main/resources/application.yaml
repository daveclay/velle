# The pharmacy application. The DataSource is PostgreSQL: under `gradle bootRun`,
# Spring Boot's Docker Compose support starts compose.yaml's database and fills
# in the URL, user, and password; a deployment sets them under spring.datasource.
# Every read and most acts need an actor: the console's "act as" field takes
# `Staff:1`, the first administrator the seed puts on the books.
server:
  port: 8093

spring:
  application:
    name: pharmacy
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
velle:
  api:
    path: /api
    ticks: true          # the console's schedule buttons; off in a deployment
  schedules:             # a cron expression per schedule the spec names
    Daily: "0 0 6 * * *"
    Hourly: "0 0 * * * *"
    Monthly: "0 0 3 1 * *"
    Nightly: "0 30 2 * * *"
  console:
    path: /velle
pharmacy:
  seed:
    enabled: true        # load ninety days of test data into an empty database (PharmacySeed)
    days: 90
logging:
  level:
    velle: info
