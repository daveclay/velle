# The database `gradle :examples:/Users/daveclay/code/velle/orderspp:bootRun` starts for the orders application.
name: velle-orders   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432"
