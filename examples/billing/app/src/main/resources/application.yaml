# The billing application. The DataSource is PostgreSQL: under `gradle bootRun`,
# Spring Boot's Docker Compose support starts compose.yaml's database and fills
# in the URL, user, and password; a deployment sets them under spring.datasource.
server:
  port: 8090

spring:
  application:
    name: billing
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
velle:
  api:
    path: /api
    ticks: true          # the console's schedule buttons; off in a deployment
  schedules:             # a cron expression per schedule, alone or with the zone it is read in
    Hourly: "0 0 * * * *"
    Weekly:
      cron: "0 0 6 * * MON"
      zone: America/New_York
  console:
    path: /velle
logging:
  level:
    velle: info
