# The database `gradle :examples:/Users/daveclay/code/velle/vendorspp:bootRun` starts for the vendors application.
name: velle-vendors   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vendors
      POSTGRES_USER: vendors
      POSTGRES_PASSWORD: vendors
    ports:
      - "5432"
