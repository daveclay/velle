# The vendors application. The DataSource is PostgreSQL: under `gradle bootRun`,
# Spring Boot's Docker Compose support starts compose.yaml's database and fills
# in the URL, user, and password; a deployment sets them under spring.datasource.
# compose.yaml also starts Authentik, the identity provider people sign in at.
server:
  port: 8096
  servlet:
    session:
      cookie:
        same-site: lax   # VendorsSecurity relies on it: no other site's POST carries the session

spring:
  application:
    name: vendors
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  security:
    oauth2:
      # Demo values, checked in on purpose: the client authentik/vendors.yaml creates.
      # Every endpoint is named, so the application starts without asking the
      # provider for its configuration; a deployment sets these for its own provider.
      client:
        registration:
          authentik:
            provider: authentik
            client-id: vendors
            client-secret: vendors-demo-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, email, profile
        provider:
          authentik:
            authorization-uri: ${velle.identity-provider}/application/o/authorize/
            token-uri: ${velle.identity-provider}/application/o/token/
            user-info-uri: ${velle.identity-provider}/application/o/userinfo/
            jwk-set-uri: ${velle.identity-provider}/application/o/vendors/jwks/
            user-name-attribute: sub
      resourceserver:
        jwt:
          issuer-uri: ${velle.identity-provider}/application/o/vendors/
          jwk-set-uri: ${velle.identity-provider}/application/o/vendors/jwks/
          audiences: vendors
velle:
  identity-provider: http://localhost:9096   # Authentik, from compose.yaml
  api:
    path: /api
    ticks: true          # the console's schedule buttons; off in a deployment
  console:
    path: /velle
logging:
  level:
    velle: info
