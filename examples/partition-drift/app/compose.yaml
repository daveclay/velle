# The database `gradle :examples:/Users/daveclay/code/velle/partition-driftpp:bootRun` starts for the partition-drift application.
name: velle-partition-drift   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partitiondrift
      POSTGRES_USER: partitiondrift
      POSTGRES_PASSWORD: partitiondrift
    ports:
      - "5432"
