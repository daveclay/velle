# The database `gradle :examples:/Users/daveclay/code/velle/loyaltypp:bootRun` starts for the loyalty application.
name: velle-loyalty   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loyalty
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty
    ports:
      - "5432"
