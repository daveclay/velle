# The database `gradle :examples:/Users/daveclay/code/velle/platelayoutpp:bootRun` starts for the platelayout application.
name: velle-platelayout   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platelayout
      POSTGRES_USER: platelayout
      POSTGRES_PASSWORD: platelayout
    ports:
      - "5432"
