# The database `gradle :examples:/Users/daveclay/code/velle/paymentspp:bootRun` starts for the payments application.
name: velle-payments   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432"
