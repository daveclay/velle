# The database `gradle :examples:/Users/daveclay/code/velle/moderationpp:bootRun` starts for the moderation application.
name: velle-moderation   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: moderation
    ports:
      - "5432"
