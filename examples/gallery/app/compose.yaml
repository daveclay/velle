# The database `gradle :examples:/Users/daveclay/code/velle/gallerypp:bootRun` starts for the gallery application.
name: velle-gallery   # one Compose project per example, so several applications run at once
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery
    ports:
      - "5432"
